name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # run by clicking buttons in the GitHub Actions UI
  workflow_dispatch:
    inputs:
      deploy-docs:
        description: 'Update the docs site?'
        required: true
        type: boolean

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

env:
  # parallelize compilation (extra important for Linux, where CRAN doesn't supply pre-compiled binaries)
  MAKEFLAGS: "-j4"

jobs:
  build-docs:
    uses: ./.github/workflows/build-docs.yaml
    permissions:
      contents: read
      id-token: write
      pages: write
    with:
      deploy: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch' && inputs.deploy-docs == true) }}
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: set up R
        uses: &setup_r r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0
      - name: run lintr
        run: |
          Rscript -e "install.packages('lintr')"
          Rscript ./.ci/lint-r-code.R $(pwd)
  test:
    name: test (ES ${{ matrix.es_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        es_version:
          - 1.7.6
          - 2.4.6
          - 5.6.16
          - 6.8.15
          - 7.0.1
          - 7.17.22
          - 8.0.1
          - 8.5.3
          - 8.10.4
          - 8.15.5
          - 8.17.2
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: set up R
        uses: *setup_r
        with:
          r-version: release
      - name: set up pandoc
        uses: r-lib/actions/setup-pandoc@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2.12.0
      - name: run tests
        shell: bash
        run: |
          export ES_VERSION=${{ matrix.es_version }}
          $GITHUB_WORKSPACE/.ci/setup.sh
          $GITHUB_WORKSPACE/.ci/install.sh
          $GITHUB_WORKSPACE/setup_local.sh ${{ matrix.es_version }}
          $GITHUB_WORKSPACE/.ci/test.sh
  all-successful:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build-docs
      - lint
      - test
    permissions:
      statuses: read
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
